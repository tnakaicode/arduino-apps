###########################
# Package org.phoebus.pv.ca
###########################

# By default, we use the following preferences settings,
# but when the System property `jca.use_env` is `true`,
# JCA falls back to the `EPICS_CA_...` environment variables.
#
# Sites that prefer to use the `EPICS_CA_...` environment variables
# thus need to add
#
# org.phoebus.pv.ca/-Djca.use_env=true
#
# to their launcher script.

# Channel Access address list.
# org.phoebus.pv.ca/addr_list=

# org.phoebus.pv.ca/auto_addr_list=true

# org.phoebus.pv.ca/max_array_bytes=100000000

# org.phoebus.pv.ca/server_port=5064

# org.phoebus.pv.ca/repeater_port=5065

# org.phoebus.pv.ca/beacon_period=15

# org.phoebus.pv.ca/connection_timeout=30

# Support variable length arrays?
#
# :format: one of `auto`, `true`, `false`
# org.phoebus.pv.ca/variable_length_array=auto

# Connect at lower priority for arrays
# with more elements than this threshold.
# org.phoebus.pv.ca/large_array_threshold= 100000

# Is the `DBE_PROPERTY` subscription supported
# to monitor for changes in units, limits etc?
# org.phoebus.pv.ca/dbe_property_supported=false

# Mask to use for subscriptions.
#
# :format: one of `VALUE`, `ALARM`, `ARCHIVE`
# org.phoebus.pv.ca/monitor_mask=VALUE

# Name server list.
# org.phoebus.pv.ca/name_servers=

###############################
# Package org.phoebus.pv.jackie
###############################

# List of servers that shall be queried via UDP when looking for channels.
#
# This setting is equivalent to the `EPICS_CA_ADDR_LIST` environment variable.
#
# It is only used when {prefs:pref}`use_env` is false.
# org.phoebus.pv.jackie/ca_address_list=

# Shall the broadcast addresses of local interfaces automatically be added to
# the list of addresses that shall be used when looking for a channel?
#
# This setting is equivalent to the `EPICS_CA_AUTO_ADDR_LIST` environment
# variable, but expects a value of `true` or `false` instead of `YES` or `NO`.
#
# It is only used when {prefs:pref}`use_env` is false.
#
# The default value is true.
# org.phoebus.pv.jackie/ca_auto_address_list=

# Shall the size of values transferred via Channel Access be limited (`false`) or
# not (`true`)?
#
# If false, the value of ca_max_array_bytes limits the size of serialized
# values that are transferred via Channel Access.
#
# This setting is equivalent to the `EPICS_CA_AUTO_ARRAY_BYTES` environment
# variable, but expects a value of `true` or `false` instead of `YES` or `NO`.
#
# This setting is only used when {prefs:pref}`use_env` is false.
#
# The default value is `true`.
# org.phoebus.pv.jackie/ca_auto_array_bytes=

# Interval between sending echo packages to a Channel Access server (in
# seconds).
#
# This setting is equivalent to the `EPICS_CA_CONN_TMO` environment variable.
#
# It is only used when {prefs:pref}`use_env` is false.
#
# The default value is 30.
# org.phoebus.pv.jackie/ca_echo_interval=

# Maximum size (in bytes) of a value that can be transferred via Channel
# Access.
#
# This setting is equivalent to the `EPICS_CA_MAX_ARRAY_BYTES` environment
# variable.
#
# It is only used when {prefs:pref}`use_env` is `false`
# and {prefs:pref}`ca_auto_array_bytes` is `false`.
#
# The default value is 16384.
# org.phoebus.pv.jackie/ca_max_array_bytes=

# Interval of the longest search period (in seconds).
#
# This setting is equivalent to the `EPICS_CA_MAX_SEARCH_PERIOD` environment
# variable.
#
# It is only used when {prefs:pref}`use_env` is false.
#
# The default value (and smallest allowed value) is 60.
# org.phoebus.pv.jackie/ca_max_search_period=

# TTL for UDP packets that are sent to multicast addresses.
#
# This setting is equivalent to the `EPICS_CA_MCAST_TTL` environment variable.
#
# It is only used when {prefs:pref}`use_env` is false.
#
# The default value (and smallest allowed value) is 1.
# The greatest allowed value is 255.
# org.phoebus.pv.jackie/ca_multicast_ttl=

# List of servers that shall be queried via UDP when looking for channels.
#
# This setting is equivalent to the `EPICS_CA_NAME_SERVERS` environment variable.
#
# It is only used when {prefs:pref}`use_env` is false.
# org.phoebus.pv.jackie/ca_name_servers=

# UDP port that is used when connecting to the Channel Access repeater.
#
# This setting is equivalent to the `EPICS_CA_REPEATER_PORT` environment
# variable.
#
# It is only used when {prefs:pref}`use_env` is false.
#
# The default value is 5065.
# org.phoebus.pv.jackie/ca_repeater_port=

# UDP and TCP port on which Channel Access servers are expected to listen.
#
# This setting is used when sending search requests and when connecting to
# serves that did not explicitly specify a port in search responses.
#
# It is only used when {prefs:pref}`use_env` is false.
#
# The default value is 5064.
# org.phoebus.pv.jackie/ca_server_port=

# Charset to use when encoding and decoding strings.
#
# The default value is UTF-8.
# org.phoebus.pv.jackie/charset=

# Time that a CID is blocked from being used again in milliseconds.
#
# After destroying a channel, the CID may not be reused for some time because
# there might still be late responses to old search requests, which would be
# used for the wrong channel if the CID was reused too early.
#
# A value of 0 (or a negative value) means that CIDs can be reused immediately.
# org.phoebus.pv.jackie/cid_block_reuse_time=900000

# Shall meta-data monitors using `DBE_PROPERTY` be created?
#
# This ensures that the meta-data for PVs is updated when it changes on the
# server, but some servers do not correctly support using `DBE_PROPERTY`. When
# experiencing problems with such a server, try setting this to false.
# org.phoebus.pv.jackie/dbe_property_supported=true

# Shall a precision of zero for a floating-point value result in this value
# being rendered without a fractional digits (`true`) or shall it be treated as
# an indication that the value should be rendered with a default number of
# fractional digits (`false`)?
# org.phoebus.pv.jackie/honor_zero_precision=true

# Hostname that is sent to the Channel Access server.
#
# If empty, the system's hostname is determined automatically.
# org.phoebus.pv.jackie/hostname=

# How to process write operations specifying a long value that is greater than
# 2147483647 or less than -2147483648. Possible settings are:
#
# - COERCE
# - COERCE_AND_WARN
# - CONVERT
# - CONVERT_AND_WARN
# - FAIL
# - TRUNCATE
# - TRUNCATE_AND_WARN
# org.phoebus.pv.jackie/long_conversion_mode=COERCE_AND_WARN

# Mask that shall be used when registering monitors for DBR_TIME_* values.
#
# :format:
#   a combination of `DBE_ALARM`, `DBE_ARCHIVE`, `DBE_PROPERTY`, and
#   `DBE_VALUE`, separated by `|`.
# org.phoebus.pv.jackie/monitor_mask=DBE_VALUE|DBE_ALARM

# Shall PVs referencing a record's `RTYP` field be treated like any other PV
# (`false`) or shall the monitor registered for the channel request the value
# only, without any meta-data like a time-stamp (`true`)?
#
# In general, setting this to false is preferred, but there are certain
# versions of EPICS where requesting a `DBR_TIME_STRING` for the `RTYP` field
# results in invalid data being returned by the server. In this case, this
# setting should be changed to `true`.
# org.phoebus.pv.jackie/rtyp_value_only=false

# Shall Channel Access client settings be read from the `CA_*` environment
# variables?
#
# If true, the `ca_*` settings from the preferences are ignored and the values
# from the process's environment are used instead. If `false`, the preferences
# are used and the environment variables are ignored.
# org.phoebus.pv.jackie/use_env=true

# Username that is sent to the Channel Access server.
#
# If empty, the username for the current process is determined automatically.
# org.phoebus.pv.jackie/username=

#############################
# Package org.phoebus.pv.mqtt
#############################

# MQTT Broker.
#
# All `mqtt://some/tag` PVs will use this broker.
# org.phoebus.pv.mqtt/mqtt_broker=tcp://localhost:1883

############################
# Package org.phoebus.pv.pva
############################

# By default, these preference settings are empty,
# and the PVA library will then honor the commonly used
# environment variables like `EPICS_PVA_ADDR_LIST`,
# `EPICS_PVA_AUTO_ADDR_LIST` etc.
#
# Defining preference values will override the environment
# variables which allows consolidating PVA settings
# with all the CS-Studio preference settings.
#
# Network clients typically need to configure the first
# three settings to successfully connect to PVA servers
# on the local network.

# PVAccess address list;
# org.phoebus.pv.pva/epics_pva_addr_list=

# PVAccess auto address list.
#
# :format: `true` or `false`
# org.phoebus.pv.pva/epics_pva_auto_addr_list=

# Name servers used for TCP name resolution.
# org.phoebus.pv.pva/epics_pva_name_servers=

# :::{caution}
# The following parameters should best be left
# at their default.
#
# For details, see `PVASettings` in PV Access library.
# :::

# Port used for UDP name searches and beacons.
# org.phoebus.pv.pva/epics_pva_broadcast_port=

# PV server's first TCP port.
# org.phoebus.pv.pva/epics_pva_server_port=

# Connection timeout in seconds.
# org.phoebus.pv.pva/epics_pva_conn_tmo=

# TCP socket creation timeout in seconds.
# org.phoebus.pv.pva/epics_pva_tcp_socket_tmo=

# Maximum number of array elements shown when printing data.
# org.phoebus.pv.pva/epics_pva_max_array_formatting=

# TCP buffer size for sending data.
# org.phoebus.pv.pva/epics_pva_send_buffer_size=

# Timeout used by plain "put" type of write
# when checking success or failure.
#
# :::{note}
# This is not used with `asyncWrite`,
# the "put-callback" which returns a Future
# for awaiting the completion,
# but only with the plain "put" that returns ASAP.
# :::
# org.phoebus.pv.pva/epics_pva_write_reply_timeout_ms=1000

##############################
# Package org.phoebus.security
##############################

# Authorization file
#
# If left empty, the built-in `core/security/authorization.conf` is used.
#
# When specifying a plain file name like `authorization.conf`,
# the install location (`Locations.install()`) is searched for that file name.
#
# The file name can also be an absolute path like `/some/path/auth.conf`.
#
# Finally, the file name may use a system property like `$(auth_file)`
# which in turn could be set to either BUILTIN, a file in the install location,
# or an absolute path.
#
# When set to an invalid file, the user will have no authorizations at all.
# org.phoebus.security/authorization_file=

# Secure store underlying implementation.
#
# :format: one of `FILE` or `IN_MEMORY`
# org.phoebus.security/secure_store_target=FILE


########################
# Package org.phoebus.ui
########################

# Show the splash screen?
#
# Can also be set via `-splash` resp. `-nosplash` command line options.
# org.phoebus.ui/splash=true

# 'Welcome' URL.
#
# When left empty, the built-in welcome.html resource is used.
#
# Site-specific products can set this to their desired URL,
# which may include Java system properties to bundle content
# with the product, for example:
#
# ```{code-block} properties
#
# org.phoebus.ui/org.phoebus.ui/welcome=file:$(phoebus.install)/welcome_to_hawkins_labs.html
# ```
# org.phoebus.ui/welcome=

# Default applications
#
# When there are multiple applications that handle
# a resource, the setting determines the one used by default.
#
# :format: comma-separated list with sub-text of default application names.
#
# For example, `run, exe` would pick `display_runtime` over `display_editor`,
# and `foo_executor` over `foo_creator`.
#
# The patterns `edit, creat` would inversely open the editor-type apps.
#
# This makes the `display_runtime` and the `3d_viewer` default apps,
# using `display_editor` and a potentially configured text editor for {file}`{name}.shp` files secondary.
# org.phoebus.ui/default_apps=run,3d,convert_edm

# Hide SPI-provided menu entries.
#
# :format: comma-separated list of class names.
# org.phoebus.ui/hide_spi_menu=org.phoebus.ui.monitoring.FreezeUI

# Top resources to show in "File" menu and toolbar
#
# :format: {samp}`{uri1} | {uri2},{Display name 2} | {uri3},{Display name 3}`
# org.phoebus.ui/top_resources=examples:/01_main.bob?app=display_runtime,Example Display | pv://?sim://sine&app=probe,Probe Example | pv://?sim://sine&loc://x(10)&app=pv_table,PV Table Example | http://www.google.com?app=web, Google

# Home display file.
#
# "Home display" button will navigate to this display.
# org.phoebus.ui/home_display=examples:/01_main.bob?app=display_runtime,Example Display

# Toolbar entries.
#
# Apps like the file browser contribute a toolbar entry.
# This setting can control which toolbar entries are shown
# and for the most part also in which order.
#
# :format: Comma-separated list of entries.
#
# The special entry `*` adds all remaining available toolbar entries.
# An entry starting with `!` removes that item from the available entries.
# The order of the initial buttons `Home, Top Resources, Layouts, Add Layouts`
# cannot be changed, but they can be suppressed by adding `!`,
# for example `Home, !Top Resources, !Layouts, !Add Layouts`.
#
# The special entry `Add Layouts` is NOT added to the toolbar by default. It
# can be added to the toolbar by specifying `Add Layouts`.
#
# The strings in the list of entries MUST match what is returned from
# `ToolbarEntry#getId()`. This allows for customization/localization of app name
# without the need to adjust the list.
#
# :::{rubric} Examples
# :::
#
# ```{code-block} properties
# :caption: Default buttons, then all remaining available items
#
# Home, Top Resources, Layouts, *
# ```
#
# ```{code-block} properties
# :caption: Default buttons, then assert that File Browser comes next
#
# Home, Top Resources, Layouts, File Browser, *
# ```
#
# ```{code-block} properties
# :caption: Only Home and File Browser:
#
# Home, !Top Resources, !Layouts, File Browser
# ```
# org.phoebus.ui/toolbar_entries=Home, Top Resources, Layouts, File Browser, *

# How many array elements to show when formatting as text?
# org.phoebus.ui/max_array_formatting=256

# UI Responsiveness Monitor Period.
#
# Period between tests in milliseconds,
# i.e. the minimum detected UI freeze duration.
#
# Set to 0 to disable.
# org.phoebus.ui/ui_monitor_period=500

# Show user ID in status bar?
# org.phoebus.ui/status_show_user=true

# Set default save path.
# org.phoebus.ui/default_save_path=

# Set the path to a folder with default layouts.
# org.phoebus.ui/layout_dir=

# Set default layout at start absolutepath.
# org.phoebus.ui/layout_default=

# If enable layout are saved in `layout_dir` instead of default user location.
# org.phoebus.ui/save_layout_in_layout_dir=false

# Compute print scaling in 'landscape' mode?
#
# Landscape mode is generally most suited for printouts
# of displays or plots, because the monitor tends to be 'wide'.
#
# At least on Mac OS X, however, the printing always appears to use
# portrait mode, so print layouts computed in landscape mode
# get cropped.
#
# Details can also depend on the printer driver.
# org.phoebus.ui/print_landscape=true

# When Picture- and/or Symbol widgets are present in an OPI,
# zooming in under Windows using the D3D graphics library can
# cause excessive VRAM usage. Setting a cache hint can work as
# a workaround. Since it has been observed that the cache hints
# also can cause graphical errors, the setting of a cache hint
# is a configurable option, which must explicitly be set to
# have effect.
#
# The setting defaults to the default caching behavior.
#
# :format:
#   one of:
#
#   The empty string or `NONE`
#   : The default caching behavior: caching is DISABLED,
#     and the cache hint is set to `CacheHint.DEFAULT`.
#
#   `DEFAULT`
#   : Caching is ENABLED, and the cache hint is set to `CacheHint.DEFAULT`.
#
#   `SPEED`
#   : Based on very limited testing,
#     this option seems to work the best as a workaround for the excessive VRAM usage.
#
#   `SCALE`
#   : This option has been observed to cause graphical errors on several systems:
#     rotated widgets have been observed to be translated instead of rotated.
#
#   or `QUALITY`, `ROTATE`, `SCALE_AND_ROTATE`.
#
# If an invalid option is entered, a warning is logged, and the
# default caching behavior is used (i.e., caching is DISABLED,
# and the cache hint is set to `CacheHint.DEFAULT`).
# org.phoebus.ui/cache_hint_for_picture_and_symbol_widgets=


# Whether or not to save user credentials to file or memory so they only have to be entered once.
#
# :::{note}
# This applies to all scopes/applications prompting for credentials.
# :::
#
# :::{seealso}
# The preference {prefs:pref}`org.phoebus.security/secure_store_target`
# :::
# org.phoebus.ui/save_credentials=false

# Location of the Phoebus documentation
# org.phoebus.ui/documentation_location=

# How to format the window title.
# The string is formatted with the current active tab as argument.
# The default is `CS-Studio: %s`, where `%s` is replaced by the name of the active tab.
#
# Setting it to just `%s` will show only the active tab.
# Omitting the %s will always show a static title.
# When there is no active tab, the {prefs:pref}`default_window_title` is used instead.
# org.phoebus.ui/window_title_format=CS-Studio: %s

# The window title when no active tab is open.
# org.phoebus.ui/default_window_title=CS-Studio

# :::{rubric} Colors
# :::
#
# Colors are of the format `R,G,B` or `R,G,B,A` values in range 0..255

# Color of the text for 'OK' alarm severity.
# org.phoebus.ui/ok_severity_text_color=0,255,0
# Color of the background for 'OK' alarm severity.
# org.phoebus.ui/ok_severity_background_color=255,255,255

# Color of the text for 'MINOR' alarm severity
# org.phoebus.ui/minor_severity_text_color=255,128,0
# Color of the background for 'MINOR' alarm severity
# org.phoebus.ui/minor_severity_background_color=255,255,255

# Color of the text for 'MAJOR' alarm severity
# org.phoebus.ui/major_severity_text_color=255,0,0
# Color of the background for 'MAJOR' alarm severity
# org.phoebus.ui/major_severity_background_color=255,255,255

# Color of the text for 'INVALID' alarm severity
# org.phoebus.ui/invalid_severity_text_color=255,0,255
# Color of the background for 'INVALID' alarm severity
# org.phoebus.ui/invalid_severity_background_color=255,255,255

# Color of text for 'UNDEFINED' alarm severity
# org.phoebus.ui/undefined_severity_text_color=200,0,200,200
# Color of background for 'UNDEFINED' alarm severity
# org.phoebus.ui/undefined_severity_background_color=255,255,255

# :::{rubric} Color Configuration for the application "Alarm Area Panel"
# :::

# org.phoebus.ui/alarm_area_panel_ok_severity_text_color=255,255,255
# org.phoebus.ui/alarm_area_panel_ok_severity_background_color=0,255,0

# org.phoebus.ui/alarm_area_panel_minor_severity_text_color=255,255,255
# org.phoebus.ui/alarm_area_panel_minor_severity_background_color=255,128,0

# org.phoebus.ui/alarm_area_panel_major_severity_text_color=255,255,255
# org.phoebus.ui/alarm_area_panel_major_severity_background_color=255,0,0

# org.phoebus.ui/alarm_area_panel_invalid_severity_text_color=255,255,255
# org.phoebus.ui/alarm_area_panel_invalid_severity_background_color=255,0,255

# org.phoebus.ui/alarm_area_panel_undefined_severity_text_color=192,192,192
# org.phoebus.ui/alarm_area_panel_undefined_severity_background_color=200,0,200,200

# When Picture- and/or Symbol widgets are present in an OPI,
# zooming in under Windows using the D3D graphics library can
# cause excessive VRAM usage. Setting a cache hint can work as
# a workaround. Since it has been observed that the cache hints
# also can cause graphical errors, the setting of a cache hint
# is a configurable option, which must explicitly be set to
# have effect.
#
# The setting defaults to the default caching behavior.
#
# Valid options are:
#       "" (the empty string) or "NONE" - The default caching behavior: caching is DISABLED, and the cache hint is set to "CacheHint.DEFAULT".
#       "DEFAULT"                       - Caching is ENABLED, and the cache hint is set to "CacheHint.DEFAULT".
#       "SPEED"                         - Based on very limited testing, this option seems to work the best as a workaround for the excessive VRAM usage.
#       "QUALITY"
#       "SCALE"                         - This option has been observed to cause graphical errors on several systems: rotated widgets have been observed to be translated instead of rotated.
#       "ROTATE"
#       "SCALE_AND_ROTATE"
#
# If an invalid option is entered, a warning is logged, and the
# default caching behavior is used (i.e., caching is DISABLED,
# and the cache hint is set to "CacheHint.DEFAULT").
# org.phoebus.ui/cache_hint_for_picture_and_symbol_widgets=


# Whether or not to save user credentials to file or memory so they only have to be entered once. Note that this
# applies to all scopes/applications prompting for credentials.
# See also setting org.phoebus.security/secure_store_target
# org.phoebus.ui/save_credentials=false

# Location of the Phoebus documentation
# org.phoebus.ui/documentation_location=

# How to format the window title.
# The string is formatted with the current active tab as argument.
# The default is "CS-Studio: %s", where %s is replaced by the name of the active tab.
# Setting it to just "%s" will show only the active tab.
# Omitting the %s will always show a static title.
# When there is no active tab, the default_window_title is used instead.
# org.phoebus.ui/window_title_format=CS-Studio: %s
# org.phoebus.ui/default_window_title=CS-Studio

# Custom stylings .css file allows users to override Phoebus and JavaFX
# default stylings.Set the full path to the .css file
# For a system file use syntax; 'file:</path/to/custom.css>'
# For a file served over http use syntax: 'http://<address:port/custom.css>'
# org.phoebus.ui/custom_css_styling=

# Keywords that can be excluded from the settings check in the About Dialog
# org.phoebus.ui/excluded_keys_from_settings_check=external_app,password,username
# org.phoebus.ui/excluded_packages_from_settings_check=eu.ess,fr.cea
