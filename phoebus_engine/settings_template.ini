##############################################
# Package org.csstudio.display.builder.runtime
##############################################

# Search path for Jython scripts used by the display runtime.
#
# Note that format depends on the OS.
# On UNIX systems, path entries are separated by `:`, on Windows by `;`.
#
# ```{code-block} properties
# :caption: Example
#
# org.csstudio.display.builder.runtime/python_path=/home/controls/displays/scripts:/home/fred/my_scripts
# ```
# org.csstudio.display.builder.runtime/python_path=

# PV Name Patches
#
# Translate PV names based on regular expression pattern and replacement
#
# :format: {samp}`{pattern}@{replacement}@{pattern}@{replacement}`
#
# Setting must contain a sequence of pattern & replacement pairs,
# all separated by `@`.
#
# The regular expression for the pattern can includes `( )` groups,
# which are then used in the replacement via `$1`, `$2`, ..
#
# If the item separator character `@` itself is required within the pattern or replacement,
# use `[@]` to distinguish it from the item separator, i.e.
#
#     [@]work@[@]home
#
# will patch `be@work` to `be@home`
#
# Patches are applied in the order they're listed in the preference, i.e.
# later patches are applied to names already patched by earlier ones.
#
# The default value leads to the following substitutions:
#
# Remove PVManager's longString modifier:
# : `some_pv {"longString":true}` -> `some_pv`
#
# Turn constant formula into constant local variable:
# org.csstudio.display.builder.runtime/: `=42` -> `loc://const42(42)`
#
# Turn constant name into constant local var:
# org.csstudio.display.builder.runtime/: `="Fred"` -> `loc://strFred("Fred")`
# org.csstudio.display.builder.runtime/pv_name_patches=\\{"longString":true\\}"@@^="([a-zA-Z]+)"@loc://str$1("$1")

# PV update throttle in milliseconds.
#
# org.csstudio.display.builder.runtime/{math}`250ms = 4Hz`
# org.csstudio.display.builder.runtime/update_throttle=250

# "Probe Display"
#
# Added to context menu for ProcessVariables,
# invoked with macro PV set to the PV name.
#
# When left empty, the "Probe Display"
# context menu entry is disabled.
# org.csstudio.display.builder.runtime/probe_display=examples:/probe.bob

# Default zoom factor (percentage) of display runtime window
# org.csstudio.display.builder.runtime/default_zoom_factor=100

